<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mission 4: Great Race</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg:#FFFFFF; --ink:#141414; --soft:#5d5d5d;
  --teal:#00A7B2; --teal-2:#32cdc8; --teal-3:#00928e; --teal-tint:#E5F7F8;
  --sun:#FAA71C; --sun-tint:#FFF4DE;
  --ember:#D77F28; --ember-tint:#FBEDE0;
  --crim:#C92426; --crim-tint:#FBE6E6;
  --line:#d4e9eb;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:18px;line-height:1.45;overflow-x:hidden}
h1,h2,h3,.disp{font-family:"Baloo 2","Lexend",system-ui,sans-serif;line-height:1.08;margin:0}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.hide{display:none!important}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:#fff;border-bottom:3px solid var(--teal);display:flex;align-items:center;gap:12px;padding:8px 16px}
.bar .brand{font-family:"Baloo 2";font-weight:800;font-size:24px;color:var(--teal)}
.bar .who{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:500}
.chip{background:var(--sun-tint);border-radius:999px;padding:4px 12px;font-size:15px;display:inline-flex;gap:6px;align-items:center}
.backbtn{border:2px solid var(--teal);background:#fff;border-radius:999px;padding:4px 14px;font-weight:600;color:var(--teal)}

.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 60px}

/* buttons */
.btn{border:0;border-radius:16px;padding:10px 20px;font-family:"Baloo 2";font-weight:700;font-size:21px;background:var(--teal);color:#fff;box-shadow:0 4px 0 var(--teal-3);transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--teal-3)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 4px 0 #c98410}
.btn.ember{background:var(--ember);box-shadow:0 4px 0 #a65d17}
.btn.crim{background:var(--crim);box-shadow:0 4px 0 #8f1517}
.btn.ghost{background:#fff;color:var(--teal);border:3px solid var(--teal);box-shadow:none}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.opt{border:3px solid var(--teal);background:#fff;border-radius:16px;padding:8px 18px;font-family:"Baloo 2";font-size:24px;font-weight:700;color:var(--ink);min-width:84px}
.opt:hover{background:var(--teal-tint)}
.opt.right{background:var(--teal);color:#fff}
.opt.wrong{border-color:var(--crim);background:var(--crim-tint);animation:shake .35s}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

/* speech */
.talk{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:end;margin-bottom:16px}
.talk svg{width:96px;height:96px}
.say{background:var(--teal-tint);border-radius:22px 22px 22px 6px;padding:14px 18px;font-size:19px;font-weight:500;position:relative;min-height:56px}
.say.bot{background:var(--crim-tint)}
.say b{color:var(--teal-3)}
.say.pop{animation:pop .35s ease-out}

/* map */
.hero{display:grid;grid-template-columns:1fr;gap:6px}
.hero h1{font-size:44px}
.hero p{margin:0 0 6px;font-size:19px}
.mapbox{position:relative;width:100%;aspect-ratio:16/10;border-radius:32px;background:linear-gradient(180deg,#f3fbfc 0%,#fff 70%);border:3px solid var(--teal-tint);overflow:hidden}
.mapbox svg.scene{position:absolute;inset:0;width:100%;height:100%}
.stop{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:4px;width:120px}
.stop .node{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:28px;color:#fff;border:5px solid #fff;box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .15s}
.stop:hover .node{transform:scale(1.1)}
.stop .lbl{background:#fff;border-radius:10px;padding:2px 8px;font-size:13px;font-weight:600;line-height:1.2;text-align:center;box-shadow:0 2px 0 rgba(0,0,0,.06)}
.stop .tag{font-size:11px;font-weight:500;color:var(--soft)}
.stop.earned .node{box-shadow:0 0 0 6px var(--sun),0 5px 0 rgba(0,0,0,.12)}
.stop .star{position:absolute;top:-8px;right:22px;width:26px;height:26px}

/* chapter */
.chhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:6px 0 14px}
.chhead .num{font-family:"Baloo 2";font-weight:800;color:#fff;background:var(--teal);border-radius:14px;padding:0 12px;font-size:26px}
.chhead h1{font-size:40px}
.steps{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 14px}
.steps button{border:2px solid var(--line);background:#fff;border-radius:999px;padding:5px 14px;font-weight:600;font-size:15px;color:var(--soft)}
.steps button[aria-current="true"]{border-color:var(--teal);background:var(--teal);color:#fff}
.steps button.ok::after{content:" ✓"}
.stage{border:3px solid var(--line);border-radius:28px;padding:18px;background:#fff}
.wslink{display:inline-flex;align-items:center;gap:8px;margin-top:14px;font-weight:600;color:var(--ember);text-decoration:none;border-bottom:2px solid var(--ember)}

/* place chart */
.pv{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.col{border-radius:20px;padding:8px;min-height:190px;display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid}
.col h3{font-size:18px;font-weight:700}
.col .bin{flex:1;width:100%;display:flex;flex-wrap:wrap;gap:4px;align-content:flex-start;justify-content:center;padding:4px}
.col .digit{font-family:"Baloo 2";font-weight:800;font-size:44px;line-height:1}
.c-th{border-color:var(--crim);background:var(--crim-tint)} .c-th h3,.c-th .digit{color:var(--crim)}
.c-h{border-color:var(--ember);background:var(--ember-tint)} .c-h h3,.c-h .digit{color:var(--ember)}
.c-t{border-color:var(--teal);background:var(--teal-tint)} .c-t h3,.c-t .digit{color:var(--teal-3)}
.c-o{border-color:var(--sun);background:var(--sun-tint)} .c-o h3,.c-o .digit{color:#b9740a}
.blk{display:inline-block;animation:drop .3s ease-out}
.squish .blk{animation:squish .6s forwards}
.flash{animation:glow .8s}
.bignum{font-family:"Baloo 2";font-weight:800;font-size:64px;letter-spacing:.02em;line-height:1}
.d-th{color:var(--crim)} .d-h{color:var(--ember)} .d-t{color:var(--teal-3)} .d-o{color:#c88010}
.goals{display:flex;gap:10px;flex-wrap:wrap}
.goal{border:2px dashed var(--teal);border-radius:14px;padding:4px 12px;font-weight:600}
.goal.done{border-style:solid;background:var(--teal);color:#fff}
.x10{display:flex;justify-content:space-around;align-items:center;margin:8px 0 0;font-family:"Baloo 2";font-weight:700;color:var(--ember);font-size:20px}

/* detective */
.detnum{display:flex;justify-content:center;gap:6px;margin:10px 0}
.detnum span{font-family:"Baloo 2";font-weight:800;font-size:80px;line-height:1;padding:0 6px;border-radius:14px}
.detnum span.target{background:var(--sun-tint);outline:4px dashed var(--sun);animation:pulse 1.2s infinite}
.detnum small{display:block;font-size:13px;font-family:"Lexend";font-weight:500;text-align:center;color:var(--soft)}
.reveal{min-height:70px;display:flex;flex-wrap:wrap;gap:6px;justify-content:center;align-items:center;margin:10px 0}

/* builder */
.clue{background:var(--sun-tint);border-radius:18px;padding:10px 16px;font-family:"Baloo 2";font-weight:700;font-size:28px;text-align:center;margin-bottom:12px}
.pm{display:flex;gap:6px}
.pm button{width:44px;height:40px;border-radius:12px;border:0;font-family:"Baloo 2";font-size:26px;font-weight:800;color:#fff}
.forms{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:12px}
.form{border-radius:16px;background:var(--teal-tint);padding:8px 12px}
.form small{display:block;color:var(--soft);font-size:13px;font-weight:600}
.form div{font-family:"Baloo 2";font-weight:700;font-size:22px;line-height:1.15}
.cards{position:relative;height:150px;margin:14px auto 4px;max-width:520px}
.card{position:absolute;top:0;height:74px;border-radius:12px;border:4px solid;background:#fff;background-clip:padding-box;display:flex;align-items:center;padding:0 10px;transition:left .9s cubic-bezier(.6,.05,.3,1.2),top .9s cubic-bezier(.6,.05,.3,1.2)}
.card.stk{border-color:transparent!important;transition:left .9s cubic-bezier(.6,.05,.3,1.2),top .9s cubic-bezier(.6,.05,.3,1.2),border-color .4s .9s}
.card span{width:38px;text-align:center;font-family:"Baloo 2";font-weight:800;font-size:52px;line-height:1}

/* swap */
.shop{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.shop .col{min-height:220px}
.shop .bin button{border:0;background:none;padding:0}
.shop .bin button:hover{transform:scale(1.1)}
.order{background:var(--ember-tint);border-radius:18px;padding:10px 16px;font-weight:600;margin-bottom:12px;font-size:19px}
.small{font-size:15px}

/* race */
.track{border-radius:20px;background:repeating-linear-gradient(90deg,#fff 0 46px,#f2fafb 46px 92px);border:3px solid var(--teal-tint);padding:8px 10px;position:relative;margin-bottom:12px}
.lane{position:relative;height:56px;border-bottom:3px dashed var(--line);display:flex;align-items:center}
.lane:last-child{border-bottom:0}
.runner{position:absolute;left:0;font-size:40px;transition:left 1.4s cubic-bezier(.3,.7,.3,1)}
.finish{position:absolute;right:10px;top:0;bottom:0;width:10px;background:repeating-linear-gradient(180deg,var(--ink) 0 10px,#fff 10px 20px);border-radius:4px}
.cmpgrid{display:grid;grid-template-columns:120px repeat(4,minmax(0,1fr));gap:6px;align-items:center}
.cmpgrid .h{font-weight:700;text-align:center;border-radius:10px;padding:4px 0;color:#fff}
.cmpgrid .who{font-weight:600;display:flex;align-items:center;gap:6px}
.cell{font-family:"Baloo 2";font-weight:800;font-size:46px;text-align:center;border-radius:14px;background:#f7fbfb;line-height:1.2}
.colbtn{border:3px solid transparent;background:none;border-radius:16px;padding:0;grid-row:span 2}
.cmpcol{display:contents}
.tapcol{cursor:pointer}
.tapcol.same{background:#eee;color:#999}
.tapcol.win{background:var(--sun-tint);outline:4px solid var(--sun)}
.signs{display:flex;gap:12px;justify-content:center;margin-top:12px}
.slots{display:flex;gap:10px;justify-content:center;margin:12px 0}
.slot{min-width:120px;height:62px;border:3px dashed var(--teal);border-radius:16px;display:grid;place-items:center;font-family:"Baloo 2";font-weight:800;font-size:30px}
.slot.full{border-style:solid;background:var(--teal-tint)}

/* lift */
.liftwrap{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
.liftsvg{width:100%;max-width:300px}
#car{transition:transform 1.4s cubic-bezier(.5,0,.3,1)}
#visitor{transition:transform 1s ease-out,opacity .5s}
.timer{font-family:"Baloo 2";font-weight:800;font-size:40px;color:var(--crim)}

/* census */
.census{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.acard{border:3px solid var(--line);border-radius:20px;padding:10px;text-align:center}
.acard .em{font-size:44px;line-height:1}
.acard .cnt{font-family:"Baloo 2";font-weight:800;font-size:32px}
.acard label{display:flex;justify-content:space-between;gap:6px;align-items:center;font-size:14px;margin-top:6px}
.acard input{width:84px;font:inherit;font-size:18px;border:0;border-bottom:3px solid var(--teal);background:var(--teal-tint);border-radius:8px 8px 0 0;padding:2px 6px;text-align:center}
.acard.ok{border-color:var(--teal);background:var(--teal-tint)}
.acard.no{border-color:var(--crim)}
.claims{display:grid;gap:10px}
.claim{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;border:3px solid var(--line);border-radius:18px;padding:8px 12px}
.claim .t{font-weight:500;font-size:19px}
.claim.fixed{border-color:var(--teal);background:var(--teal-tint)}

/* overlay */
.ovl{position:fixed;inset:0;background:rgba(255,255,255,.86);display:grid;place-items:center;z-index:50;padding:16px}
.ovcard{background:#fff;border:4px solid var(--teal);border-radius:32px;padding:26px;max-width:460px;width:100%;text-align:center;box-shadow:0 14px 0 var(--teal-tint);animation:pop .4s}
.ovcard h2{font-size:38px;margin:8px 0}
.ovcard input{font:inherit;font-size:24px;border:0;border-bottom:4px solid var(--teal);background:var(--teal-tint);border-radius:12px 12px 0 0;padding:8px 12px;width:100%;text-align:center;margin:10px 0 16px}
.medal{width:150px;height:150px;margin:0 auto;animation:spinin .9s}
.confetti{position:fixed;top:-20px;width:12px;height:18px;border-radius:3px;z-index:60;pointer-events:none;animation:fall linear forwards}

@keyframes pop{0%{transform:scale(.85);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@keyframes drop{0%{transform:translateY(-18px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes squish{0%{transform:none}60%{transform:translateX(-30px) scale(.7)}100%{transform:translateX(-80px) scale(.1);opacity:0}}
@keyframes glow{0%{box-shadow:0 0 0 0 var(--sun)}50%{box-shadow:0 0 0 10px rgba(250,167,28,.4)}100%{box-shadow:0 0 0 0 rgba(250,167,28,0)}}
@keyframes pulse{50%{transform:scale(1.06)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@keyframes spinin{0%{transform:rotate(-200deg) scale(.2)}100%{transform:none}}
@keyframes bob{50%{transform:translateY(-6px)}}
.bob{animation:bob 2.4s ease-in-out infinite}

@media (max-width:760px){
  .bar .brand{font-size:19px}.chip{font-size:13px}
  .pv{grid-template-columns:repeat(2,minmax(0,1fr))}
  .forms{grid-template-columns:1fr}
  .liftwrap{grid-template-columns:1fr}
  .shop{grid-template-columns:1fr}
  .hero h1{font-size:34px}.chhead h1{font-size:30px}
  .talk{grid-template-columns:64px 1fr}.talk svg{width:64px;height:64px}
  .mapbox{aspect-ratio:auto;height:760px}
  .detnum span{font-size:56px}
  .cmpgrid{grid-template-columns:80px repeat(4,minmax(0,1fr))}
  .cell{font-size:34px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#toMap{display:none!important}
</style>
</head>

</svg>

<header class="bar">
  <span class="brand">Place Value Park · Mission 4</span>
  <button class="backbtn hide" id="toMap">Back to the trail</button>
  <div class="who"><span class="chip" id="nameChip">Ranger</span><span class="chip" id="badgeChip"><svg width="18" height="18"><use href="#starf"/></svg><span id="badgeCount">0</span> badges</span></div>
</header>

<main class="wrap">
  <section id="map"></section>
  <section id="chapter" class="hide"></section>
</main>

<div class="ovl hide" id="nameOvl" role="dialog" aria-modal="true" aria-labelledby="nameH">
  <div class="ovcard">
    <svg viewBox="0 0 120 120" width="120" height="120" class="bob" role="img" aria-label="Ranger Pip"><use href="#pip"/></svg>
    <h2 id="nameH">Hi! I'm Ranger Pip.</h2>
    <p>Welcome to Place Value Park. What is your ranger name?</p>
    <input id="nameIn" maxlength="18" aria-label="Your ranger name" placeholder="Type your name">
    <button class="btn" id="nameGo">Start the mission</button>
  </div>
</div>

<div class="ovl hide" id="winOvl" role="dialog" aria-modal="true" aria-labelledby="winH">
  <div class="ovcard">
    <svg class="medal" viewBox="0 0 160 160" aria-hidden="true">
      <path d="M52 6 L70 60 L56 64 Z" fill="#00A7B2"/><path d="M108 6 L90 60 L104 64 Z" fill="#C92426"/>
      <circle cx="80" cy="96" r="54" fill="#FAA71C"/><circle cx="80" cy="96" r="42" fill="#fff" opacity=".35"/>
      <use href="#starf" x="46" y="62" width="68" height="68"/>
    </svg>
    <h2 id="winH">Badge earned!</h2>
    <p id="winTxt"></p>
    <button class="btn" id="winGo">Play again</button>
  </div>
</div>

<script>
(function(){
"use strict";

const $=s=>document.querySelector(s);
const fmt=n=>Number(n).toLocaleString('en-US');
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const ONES=['zero','one','two','three','four','five','six','seven','eight','nine','ten','eleven','twelve','thirteen','fourteen','fifteen','sixteen','seventeen','eighteen','nineteen'];
const TENS=['','','twenty','thirty','forty','fifty','sixty','seventy','eighty','ninety'];
function words(n){
  if(n===0)return 'zero';
  const th=Math.floor(n/1000),h=Math.floor(n%1000/100),r=n%100,p=[];
  if(h)p.push(ONES[h]+' hundred');
  if(r)p.push(r<20?ONES[r]:TENS[Math.floor(r/10)]+(r%10?'-'+ONES[r%10]:''));
  const rest=p.join(' ');
  return th?(ONES[th]+' thousand'+(rest?', '+rest:'')):rest;
}
function parts(n){return{th:Math.floor(n/1000),h:Math.floor(n%1000/100),t:Math.floor(n%100/10),o:n%10};}
function expanded(n){const p=parts(n),a=[];if(p.th)a.push(fmt(p.th*1000));if(p.h)a.push(p.h*100);if(p.t)a.push(p.t*10);if(p.o)a.push(p.o);return a.length?a.join(' + '):'0';}
const ICON={th:['crate',42,42],h:['tray',38,38],t:['stick',12,42],o:['berry',22,22]};
function blocks(k,n,clickable){let s='';for(let i=0;i<n;i++){const [id,w,h]=ICON[k];s+=clickable?`<button data-k="${k}" aria-label="Open this ${id}"><svg class="blk" width="${w}" height="${h}"><use href="#${id}"/></svg></button>`:`<svg class="blk" width="${w}" height="${h}" aria-hidden="true"><use href="#${id}"/></svg>`;}return s;}
function colorNum(n){const s=String(n).padStart(1,'0'),L=s.length,cls=['d-o','d-t','d-h','d-th'];let out='';for(let i=0;i<L;i++){const pos=L-1-i;out+=`<span class="${cls[pos]}">${s[i]}</span>`;if(pos===3)out+='<span style="color:#999">,</span>';}return out;}

function confetti(n){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const cols=['#00A7B2','#FAA71C','#D77F28','#C92426','#32cdc8'];
  for(let i=0;i<(n||60);i++){const d=document.createElement('div');d.className='confetti';d.style.left=Math.random()*100+'vw';d.style.background=cols[i%5];d.style.animationDuration=(1.6+Math.random()*1.6)+'s';d.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),3800);}
}

function stepper(el,names,render){

/* ================= MISSION 1 ================= */
function m1(el,c){
  stepper(el,['Bundling Machine','Digit Detective'],(i,stg,done)=>i===0?bundle(stg,done):detective(stg,()=>{done();earn(1,c.badge);}));
}
function bundle(stg,done){
  const st={th:0,h:0,t:0,o:0};let busy=false;const goals=[[10,'Make 10'],[34,'Make 34'],[100,'Make 100']];const met=new Set();
  stg.innerHTML=talk('pip',`Oops-Bot spilled berries everywhere, Ranger <b>${S.name}</b>! Counting one by one takes forever. Add berries and watch what the machine does when you get to <b>10</b>.`)+
   `<div class="goals" id="goals">${goals.map(g=>`<span class="goal" data-g="${g[0]}">${g[1]}</span>`).join('')}</div>
    <div style="text-align:center;margin:12px 0"><div class="bignum" id="num" aria-live="polite">0</div></div>
    <div class="pv" id="pv"></div>
    <div class="x10 hide" id="x10" aria-label="Each place is 10 times the place to its right"><span>Thousands</span><span>← ×10</span><span>Hundreds</span><span>← ×10</span><span>Tens</span><span>← ×10</span><span>Ones</span></div>
    <div class="row" style="justify-content:center;margin-top:14px">
      <button class="btn sun" id="add1">+1 berry</button>
      <button class="btn" id="add10" disabled>+10 berries</button>
      <button class="btn ghost" id="reset">Start again</button>
      <button class="btn ember hide" id="next1">Next: Digit Detective</button></div>`;
  const pv=stg.querySelector('#pv');
  function total(){return st.th*1000+st.h*100+st.t*10+st.o;}
  function draw(flash){
    const cols=[['th','Thousands','c-th'],['h','Hundreds','c-h'],['t','Tens','c-t'],['o','Ones','c-o']];
    pv.innerHTML=cols.map(([k,n,cl])=>`<div class="col ${cl} ${flash===k?'flash':''}" id="col-${k}"><h3>${n}</h3><div class="bin">${blocks(k,st[k])}</div><div class="digit">${st[k]}</div></div>`).join('');
    stg.querySelector('#num').innerHTML=colorNum(total());
    const tt=total();goals.forEach(([g])=>{if(tt===g&&!met.has(g)){met.add(g);stg.querySelector(`[data-g="${g}"]`).classList.add('done');onGoal(g);}});
  }
  function onGoal(g){
    if(g===10){say(stg,'pip','Whoa! <b>10 berries</b> squeezed into <b>1 stick</b>. Same berries, new name. Now make <b>34</b>. You can use +10 now!');stg.querySelector('#add10').disabled=false;confetti(25);}
    if(g===34){say(stg,'pip','34 = <b>3 sticks</b> and <b>4 berries</b>. The 3 is not worth 3. It sits in the tens place, so it is worth <b>30</b>! Now keep going to <b>100</b>.');confetti(25);}
    if(g===100){say(stg,'pip','<b>10 sticks</b> made <b>1 tray</b>! Every time we get 10, we bundle and move one place left. So each place is worth <b>10 times</b> more.');stg.querySelector('#x10').classList.remove('hide');stg.querySelector('#next1').classList.remove('hide');confetti(50);}
  }
  function carry(k,next,cb){
    const col=pv.querySelector('#col-'+k);col.classList.add('squish');
    setTimeout(()=>{st[k]=0;st[next]++;draw(next);cb&&cb();},650);
  }
  function settle(cb){
    if(st.o>=10){busy=true;draw();carry('o','t',()=>settle(cb));return;}
    if(st.t>=10){busy=true;draw();carry('t','h',()=>settle(cb));return;}
    if(st.h>=10){busy=true;draw();carry('h','th',()=>settle(cb));return;}
    busy=false;draw();cb&&cb();
  }
  stg.querySelector('#add1').onclick=()=>{if(busy)return;st.o++;settle();};
  stg.querySelector('#add10').onclick=()=>{if(busy)return;st.o+=10;draw();settle();};
  stg.querySelector('#reset').onclick=()=>{if(busy)return;st.th=st.h=st.t=st.o=0;draw();};
  stg.querySelector('#next1').onclick=done;
  draw();
}
function detective(stg,done){
  const Q=[[572,7],[4520,5],[1836,8],[6040,4],[3333,3,'first'],[9215,9]];let qi=0;
  const PL=['ones','tens','hundreds','thousands'],K=['o','t','h','th'];
  stg.innerHTML=talk('pip','Detective time! Look at the glowing digit. Where does it sit? What is it <b>worth</b>?')+
   `<div id="dq"></div><div class="reveal" id="rv"></div><div class="row" style="justify-content:center" id="opts"></div>
    <p class="small" style="text-align:center;color:var(--soft)" id="prog"></p>`;
  function ask(){
    const [n,d,mode]=Q[qi],s=String(n);let idx=mode==='first'?0:s.indexOf(String(d));const pos=s.length-1-idx;
    stg.querySelector('#dq').innerHTML=`<div class="detnum">${[...s].map((ch,i)=>{const p=s.length-1-i;return `<span class="${i===idx?'target':''} ${['d-o','d-t','d-h','d-th'][p]}">${ch}<small>${PL[p]}</small></span>`;}).join('')}</div>
      <p style="text-align:center;font-weight:600;font-size:21px;margin:0">What is the glowing <b>${d}</b> worth in ${fmt(n)}?</p>`;
    stg.querySelector('#rv').innerHTML='';stg.querySelector('#prog').textContent=`Case ${qi+1} of ${Q.length}`;
    const right=d*Math.pow(10,pos);const opts=shuffle([...new Set([d,d*10,d*100,d*1000])]);
    const o=stg.querySelector('#opts');o.innerHTML=opts.map(v=>`<button class="opt" data-v="${v}">${fmt(v)}</button>`).join('');
    o.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(+b.dataset.v===right){b.classList.add('right');o.querySelectorAll('.opt').forEach(x=>x.disabled=true);
        stg.querySelector('#rv').innerHTML=blocks(K[pos],d);
        say(stg,'pip',`Yes! The ${d} sits in the <b>${PL[pos]}</b> place, so it means ${d} ${['berries','sticks','trays','crates'][pos]}. That is worth <b>${fmt(right)}</b>.`);
        confetti(20);
        setTimeout(()=>{qi++;if(qi<Q.length){ask();say(stg,'pip','Next case! What is the glowing digit worth?');}else{say(stg,'pip','Case closed! You can see the hidden value of any digit.');done();}},2300);
      }else{b.classList.add('wrong');say(stg,'bot',`Oops! That's my mistake too. Look at the word under the digit. Which <b>place</b> is it in?`);}
    });
  }
  ask();
}

/* ================= MISSION 2 ================= */
function m2(el,c){
  stepper(el,['Number Builder','Sign Fixer'],(i,stg,done)=>i===0?builder(stg,done):signFixer(stg,()=>{done();earn(2,c.badge);}));
}
function builder(stg,done){
  const T=[['2 crates, 3 trays, 1 stick, 4 berries',2314],['7,000 + 80 + 9',7089],['six thousand, forty',6040],['3,108',3108],['5 thousands, 0 hundreds, 2 tens, 9 ones',5029],['The biggest number you can make with 0, 3, 8, 9',9830]];
  let ti=0;const st={th:0,h:0,t:0,o:0};
  stg.innerHTML=talk('pip','Every animal home needs a number sign. Read the clue, then build the home with crates, trays, sticks and berries.')+
   `<div class="clue" id="clue"></div><div class="pv" id="pv"></div>
    <div class="forms"><div class="form"><small>Standard form</small><div id="fS"></div></div><div class="form"><small>Expanded form</small><div id="fE"></div></div><div class="form"><small>Word form</small><div id="fW" style="font-size:18px"></div></div></div>
    <div class="cards hide" id="cards" aria-hidden="true"></div>
    <div class="row" style="justify-content:center;margin-top:14px"><button class="btn sun" id="chk">Check my home</button><button class="btn hide" id="nx">Next home</button></div>
    <p class="small" style="text-align:center;color:var(--soft)" id="prog"></p>`;
  const pv=stg.querySelector('#pv');
  const cols=[['th','Crates (1,000)','c-th','#C92426'],['h','Trays (100)','c-h','#D77F28'],['t','Sticks (10)','c-t','#00A7B2'],['o','Berries (1)','c-o','#FAA71C']];
  function val(){return st.th*1000+st.h*100+st.t*10+st.o;}
  function draw(){
    pv.innerHTML=cols.map(([k,n,cl,col])=>`<div class="col ${cl}"><h3>${n}</h3><div class="bin">${blocks(k,st[k])}</div><div class="digit">${st[k]}</div>
      <div class="pm"><button style="background:${col}" data-k="${k}" data-d="-1" aria-label="Take away one">−</button><button style="background:${col}" data-k="${k}" data-d="1" aria-label="Add one">+</button></div></div>`).join('');
    pv.querySelectorAll('.pm button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;st[k]=Math.max(0,Math.min(9,st[k]+ +b.dataset.d));draw();});
    const v=val();stg.querySelector('#fS').innerHTML=colorNum(v);stg.querySelector('#fE').textContent=expanded(v);stg.querySelector('#fW').textContent=words(v);
  }
  function load(){st.th=st.h=st.t=st.o=0;stg.querySelector('#clue').textContent='Home sign: '+T[ti][0];stg.querySelector('#cards').classList.add('hide');stg.querySelector('#nx').classList.add('hide');stg.querySelector('#chk').classList.remove('hide');stg.querySelector('#prog').textContent=`Home ${ti+1} of ${T.length}`;draw();}
  function slideCards(n){
    const box=stg.querySelector('#cards');box.classList.remove('hide');const p=parts(n);
    const list=[[p.th*1000,'#C92426'],[p.h*100,'#D77F28'],[p.t*10,'#00A7B2'],[p.o,'#FAA71C']].filter(x=>x[0]>0);
    const W=38,pad=20;const maxLen=String(list[0][0]).length;const fullW=maxLen*W+pad+8;
    box.innerHTML=list.map(([v,col],i)=>{const s=String(v);return `<div class="card" style="border-color:${col};z-index:${i+1};width:${s.length*W+pad}px">${[...s].map(d=>`<span style="color:${col}">${d}</span>`).join('')}</div>`;}).join('');
    const cards=[...box.children];const bw=box.clientWidth;let x=0;
    cards.forEach((cd,i)=>{cd.style.left=x+'px';cd.style.top=(i%2?70:0)+'px';x+=cd.offsetWidth+12;});
    const scale=Math.min(1,bw/x);if(scale<1)box.style.transform=`scale(${scale})`,box.style.transformOrigin='left top';
    const right=(bw/scale)/2+fullW/2;
    setTimeout(()=>{cards.forEach((cd,i)=>{cd.style.left=(right-cd.offsetWidth)+'px';cd.style.top='36px';if(i>0)cd.classList.add('stk');});box.style.transform='none';},900);
  }
  stg.querySelector('#chk').onclick=()=>{
    const tgt=T[ti][1],v=val();
    if(v===tgt){confetti(30);slideCards(tgt);stg.querySelector('#chk').classList.add('hide');stg.querySelector('#nx').classList.remove('hide');
      say(stg,'pip',`Perfect home! <b>${fmt(tgt)}</b>. Watch the cards slide together: the zeros hide behind the digits.${/0/.test(String(tgt))?' See the <b>0</b>? It keeps an empty place, so every digit stays in the right spot.':''}`);}
    else{const a=parts(v),b=parts(tgt);const off=[['th','crates'],['h','trays'],['t','sticks'],['o','berries']].find(([k])=>a[k]!==b[k]);
      say(stg,'bot',`Oops! Something is not quite right. Count your <b>${off[1]}</b> again and read the clue one more time.`);}
  };
  stg.querySelector('#nx').onclick=()=>{ti++;if(ti<T.length){load();say(stg,'pip','Next home! Read the clue and build it.');}else{say(stg,'pip','Every animal has a home! Now help Oops-Bot fix his signs.');done();}};
  load();
}
function signFixer(stg,done){
  const Q=[['4,000 + 30 + 5 = 435',['4,035','435','4,305'],'4,035'],['seven thousand, eighty = 780',['7,080','780','7,800'],'7,080'],['1,050 = one thousand, five hundred',['one thousand, fifty','one thousand, five hundred','one hundred fifty'],'one thousand, fifty'],['3 crates and 6 berries = 36',['3,006','36','3,060'],'3,006']];
  let qi=0;
  stg.innerHTML=talk('bot','I made the home signs myself! Are they right? Pick the correct sign for each one.')+`<div id="sq"></div><div class="row" id="so" style="justify-content:center;margin-top:10px"></div>`;
  function ask(){
    const q=Q[qi];stg.querySelector('#sq').innerHTML=`<div class="clue" style="background:var(--crim-tint)">Oops-Bot's sign: ${q[0]}</div><p style="text-align:center;margin:0">What should the sign say?</p>`;

    ['Otters 487 → nearest 10: 480',false,['490','480','500'],'490'],['Turtles 1,650 → nearest 100: 1,700',true],['Turtles 1,650 < Flamingos 1,248',false,['>','<','='],'>'],['Penguins have the most',true]];
  let solved=0;const need=C.length;
  stg.innerHTML=talk('bot','I filled in the census board all by myself! But something looks wrong... Is each line <b>right</b> or an <b>oops</b>?')+`<div class="claims">${C.map((c,i)=>`<div class="claim" id="cl${i}"><span class="t">${c[0]}</span><span class="row" id="cb${i}"><button class="opt" style="font-size:18px" data-i="${i}" data-v="1">Right</button><button class="opt" style="font-size:18px" data-i="${i}" data-v="0">Oops</button></span></div>`).join('')}</div>`;
  stg.querySelectorAll('.claims .opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i,c=C[i],said=b.dataset.v==='1';const box=stg.querySelector('#cb'+i);
    if(said===c[1]){if(c[1]){box.innerHTML='<b style="color:var(--teal-3)">Checked ✓</b>';stg.querySelector('#cl'+i).classList.add('fixed');win();}
      else{box.innerHTML=`<span class="small">Fix it:</span>`+c[2].map(v=>`<button class="opt" style="font-size:18px">${v}</button>`).join('');
        box.querySelectorAll('.opt').forEach(f=>f.onclick=()=>{if(f.textContent===c[3]){box.innerHTML=`<b style="color:var(--teal-3)">Fixed: ${c[3]} ✓</b>`;stg.querySelector('#cl'+i).classList.add('fixed');say(stg,'bot','Thank you, Detective! Now the animals get the right amount of food.');confetti(20);win();}else f.classList.add('wrong');});}}
    else{b.classList.add('wrong');say(stg,'pip',c[1]?'Look again carefully. Check it with floors and the middle, or line up the places.':'Hmm, are you sure? Find the two floors and the middle, then check.');}});
  function win(){solved++;if(solved===need){say(stg,'pip','Case closed! You found every mistake and fixed it. Ranger <b>'+S.name+'</b>, you are an Error Detective!');done();}}
}

/* ---------- boot ---------- */
refreshBar();
function start(){openCh(ONLY);}
if(!S.name){$('#nameOvl').classList.remove('hide');setTimeout(()=>$('#nameIn').focus(),100);}else start();
function setName(){const v=$('#nameIn').value.trim();if(!v){$('#nameIn').focus();return;}S.name=v.slice(0,18);save();refreshBar();$('#nameOvl').classList.add('hide');start();}
$('#nameGo').onclick=setName;$('#nameIn').onkeydown=e=>{if(e.key==='Enter')setName();};
$('#nameChip').onclick=()=>{$('#nameIn').value=S.name;$('#nameOvl').classList.remove('hide');};
})();
</script>
